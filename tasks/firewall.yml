---
- name: Install UFW on Debian-based systems
  ansible.builtin.package:
    name: ufw
    state: present
  when:
    - enable_firewall
    - ansible_os_family == "Debian"

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
  when:
    - enable_firewall
    - ansible_os_family == "Debian"

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
  when:
    - enable_firewall
    - ansible_os_family == "Debian"

- name: Install firewalld on RHEL-based systems
  ansible.builtin.package:
    name: firewalld
    state: present
  when:
    - enable_firewall
    - ansible_os_family == "RedHat"

- name: Start firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when:
    - enable_firewall
    - ansible_os_family == "RedHat"

- name: Allow SSH through firewalld
  ansible.posix.firewalld:
    port: "{{ ssh_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when:
    - enable_firewall
    - ansible_os_family == "RedHat"
